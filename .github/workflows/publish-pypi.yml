name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:        # manual TestPyPI dry-run
  pull_request:             # build-check only (no publish)
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hatch-vcs needs tags for the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Release rehearsal: a workflow_dispatch on release/X.Y.Z or hotfix/X.Y.Z
      # builds the EXACT release version (from the branch name), not
      # X.Y.Z.devN. main is tag-derived (checked in publish-testpypi); other
      # refs keep devN.
      - name: Pin release version (dispatch on release/X.Y.Z or hotfix/X.Y.Z only)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (startsWith(github.ref, 'refs/heads/release/') ||
          startsWith(github.ref, 'refs/heads/hotfix/'))
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            release/*) V="${REF_NAME#release/}" ;;
            hotfix/*) V="${REF_NAME#hotfix/}" ;;
            *) V="" ;;
          esac
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$REF_NAME' is not release/X.Y.Z or hotfix/X.Y.Z"
            exit 1
          fi
          PKG=$(jq -r .version integrations/pi/package.json)
          if [ "$PKG" != "$V" ]; then
            echo "::error::pi package.json is $PKG, not $V; run set-version"
            exit 1
          fi
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$V" >> "$GITHUB_ENV"
          echo "pinned rehearsal version: $V"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build "twine>=7.0"
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Schema snapshot-sync gate (migrations ↔ current-schema.json)
        run: |
          python -m pip install --quiet '.[migrate]'
          export XDG_DATA_HOME="$(mktemp -d)"
          sandesh setup --project ci
          sandesh migrate --all
          sandesh migrate --dump-schema > "$XDG_DATA_HOME/dumped.json"
          python -c "import json,sys; a=json.load(open('$XDG_DATA_HOME/dumped.json')); b=json.load(open('sandesh/schema/current-schema.json')); sys.exit(0 if a==b else 1)"
          echo "✓ current-schema.json in sync with migrations"

  create-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need full tag history to detect the tag at HEAD
      - name: Create GitHub Release for version tag at HEAD (idempotent)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}   # PAT so 'release: published' re-fires (default GITHUB_TOKEN would not)
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$TAG" ]; then
            echo "::notice::no version tag at HEAD — ordinary main commit, nothing to release"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release exists for $TAG — nothing to do"
            exit 0
          fi
          gh release create "$TAG" --generate-notes

  publish-pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write           # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # guard needs origin/main history for the ancestry check
      - name: Guard — tag ref + on-main ancestry
        run: |
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to publish: $GITHUB_REF is not a clean version tag (^refs/tags/v[0-9]+.[0-9]+.[0-9]+$)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::refusing to publish: $GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # no password / no token — trusted publishing; attestations default-on

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Check the artifact that is actually uploaded (no rebuild).
      - name: Version sanity - no '+' segment; exact on release/hotfix/main
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SDIST=$(find dist -maxdepth 1 -name '*.tar.gz' | head -1)
          VER=$(basename "$SDIST" .tar.gz | sed -E 's/^[a-z_]+-//')
          echo "artifact version: $VER"
          if [ -z "$SDIST" ] || [ -z "$VER" ]; then
            echo "::error::no sdist in the dist artifact"
            exit 1
          fi
          if echo "$VER" | grep -q '+'; then
            echo "::error::'$VER' has a '+' local segment;" \
                 "TestPyPI rejects PEP 440 local versions"
            exit 1
          fi
          case "$REF" in
            refs/heads/release/*)
              if [ "$VER" != "${REF_NAME#release/}" ]; then
                echo "::error::rehearsal must be ${REF_NAME#release/}," \
                     "artifact is $VER"
                exit 1
              fi ;;
            refs/heads/hotfix/*)
              if [ "$VER" != "${REF_NAME#hotfix/}" ]; then
                echo "::error::rehearsal must be ${REF_NAME#hotfix/}," \
                     "artifact is $VER"
                exit 1
              fi ;;
            refs/heads/main)
              if echo "$VER" | grep -q 'dev'; then
                echo "::error::main needs its vX.Y.Z tag at HEAD;" \
                     "refusing dev version $VER"
                exit 1
              fi ;;
          esac
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
